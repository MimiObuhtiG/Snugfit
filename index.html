<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2559A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SnugFit">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>SnugFit — Lazy Workouts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --pink:#F2559A;--pink2:#FF8CC0;--plum:#8E3AA6;--plum2:#C25BD0;--lime:#DCDA2E;--lime2:#F4F28A;
  --coral:#FF6F61;--teal:#2EBFA5;--orange:#FFA03A;
  --ink:#22172B;--ink2:#6A5C75;--ink3:#A597AE;--bg:#FFF6FA;--card:#FFFFFF;--line:#F3E4EE;
  --shadow:0 10px 30px -12px rgba(142,58,166,.28);
  --r:22px;
  --g1:#F2559A;--g2:#8E3AA6;--raise:#FBF1F7;--tile:#fff;--tile-ink:#22172B;--c-wx:#5A62C9;--c-teal:#1F9E88;--coral:#FF6F61;
  --won:#3C8A2E;--won-bg:#E2F5DC;--rest-in:#EFFBF8;--lvl-bg:#FBFAD9;--lvl-ink:#6b6900;--lime-d:#9DBA2A;
  --f-core:#F2559A;--fb-core:#FDE7F1;--f-lower:#8E3AA6;--fb-lower:#F3E6F8;--f-upper:#8A8700;--fb-upper:#F7F6C7;--f-cardio:#FF6F61;--fb-cardio:#FFE9E6;
  --f-warm:#E88A1A;--fb-warm:#FFF0DE;--f-stretch:#1F9E88;--fb-stretch:#E1F7F2;--f-walk:#2E7FBF;--fb-walk:#E2F0FA;
  --f-home:#E88A1A;--fb-home:#FFF0DE;--f-full:#8E3AA6;--fb-full:#F3E6F8;--f-burn:#FF6F61;--fb-burn:#FFE9E6;
  --scene:#EFE2EA;--scene2:#E2D0DC;--demo-bg:#FBF3F8;
}
/* Night Bloom: dark theme. Same pink and plum family on deep aubergine. */
html.dark{color-scheme:dark;
  --pink:#FF6BAA;--pink2:#FF8CC0;--plum:#C98BEA;--plum2:#B46CDE;--lime:#E4E36B;--lime2:#F0EF8A;--coral:#FF8A7A;--teal:#4FD1B8;
  --ink:#F7EEF8;--ink2:#CDBAD8;--ink3:#9A87A6;--bg:#1B1221;--card:#271A30;--line:#3A2B46;--shadow:0 12px 30px -14px rgba(0,0,0,.7);
  --g1:#E2468C;--g2:#7A2E96;--raise:#33243E;--tile:#33243E;--tile-ink:#E4E36B;--c-wx:#9AA8FF;--c-teal:#4FD1B8;
  --won:#8FD67C;--won-bg:#1F2E1E;--rest-in:#17302E;--lvl-bg:#33321E;--lvl-ink:#E4E36B;--lime-d:#C9C64A;
  --f-core:#FF6BAA;--fb-core:#3A2033;--f-lower:#C98BEA;--fb-lower:#33213F;--f-upper:#E4E36B;--fb-upper:#33321E;--f-cardio:#FF8A7A;--fb-cardio:#3A2226;
  --f-warm:#FFB15C;--fb-warm:#3A2A1C;--f-stretch:#4FD1B8;--fb-stretch:#17302E;--f-walk:#7CC0F2;--fb-walk:#1B2B3C;
  --f-home:#FFB15C;--fb-home:#3A2A1C;--f-full:#C98BEA;--fb-full:#33213F;--f-burn:#FF8A7A;--fb-burn:#3A2226;
  --scene:#33243E;--scene2:#47354F;--demo-bg:#21162A}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
h1,h2,h3,.disp{font-family:Fredoka,Nunito,sans-serif;margin:0;letter-spacing:-.01em}
.app{max-width:480px;margin:0 auto;min-height:100vh;padding:calc(env(safe-area-inset-top) + 14px) 18px calc(env(safe-area-inset-bottom) + 96px);position:relative}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,var(--pink),var(--plum));display:grid;place-items:center;box-shadow:0 6px 16px -6px rgba(242,85,154,.7)}
.brand b{font-family:Fredoka;font-size:22px;font-weight:700}
.brand b span{color:var(--pink)}
.streak{display:flex;align-items:center;gap:6px;background:#fff;border:1.5px solid var(--line);padding:7px 12px;border-radius:999px;font-weight:800;font-size:15px}
.hello{font-size:15px;color:var(--ink2);font-weight:700;margin:2px 0 4px}
.h1{font-size:28px;line-height:1.1;font-weight:700;margin-bottom:16px}
.hero{border-radius:28px;padding:20px;color:#fff;background:radial-gradient(120% 140% at 100% 0%,#FFB3D5 0%,rgba(255,179,213,0) 45%),linear-gradient(140deg,var(--pink) 0%,var(--plum) 100%);box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero.rest{background:radial-gradient(120% 140% at 100% 0%,#B9F3E8 0%,rgba(185,243,232,0) 45%),linear-gradient(140deg,#35C9AE 0%,#5A62C9 100%)}
.hero .tag{display:inline-flex;gap:6px;align-items:center;background:rgba(255,255,255,.2);padding:5px 11px;border-radius:999px;font-size:12.5px;font-weight:800;letter-spacing:.02em;backdrop-filter:blur(6px)}
.hero h2{font-size:27px;margin:12px 0 6px;font-weight:700}
.hero p{margin:0 0 16px;opacity:.92;font-weight:600;font-size:14.5px}
.hero .bar{height:8px;background:rgba(255,255,255,.25);border-radius:9px;overflow:hidden;margin-bottom:16px}
.hero .bar i{display:block;height:100%;background:var(--lime2);border-radius:9px}
.hero .deco{position:absolute;right:-18px;bottom:-22px;opacity:.18;pointer-events:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 22px;border-radius:16px;font-weight:800;font-size:16px;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.white{background:#fff;color:var(--plum)}
.btn.ghost{background:rgba(255,255,255,.18);color:#fff}
.btn.pink{background:linear-gradient(135deg,var(--pink),var(--plum2));color:#fff;box-shadow:0 8px 20px -8px rgba(242,85,154,.8)}
.btn.lime{background:var(--lime);color:var(--ink)}
.btn.soft{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
.btn.block{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap}
.sec{margin:24px 0 10px;display:flex;justify-content:space-between;align-items:baseline}
.sec h3{font-size:19px;font-weight:600}
.sec small{color:var(--ink3);font-weight:700}
.card{background:var(--card);border-radius:var(--r);padding:16px;border:1.5px solid var(--line)}
.lbl{font-size:12.5px;font-weight:800;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;margin:14px 0 8px}
.lbl:first-child{margin-top:0}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:9px 14px;border-radius:999px;background:#FBF1F7;border:1.5px solid transparent;font-weight:800;font-size:14px;color:var(--ink2)}
.chip.on{background:#fff;border-color:var(--pink);color:var(--pink);box-shadow:0 4px 12px -6px rgba(242,85,154,.6)}
.dice{display:flex;align-items:center;gap:14px;padding:16px;border-radius:var(--r);background:linear-gradient(135deg,#FFFBD1,#F4F28A);border:1.5px solid #ECE77A;width:100%;text-align:left;margin-top:12px}
.dice .ico{width:48px;height:48px;border-radius:15px;background:var(--ink);display:grid;place-items:center;flex:none}
.dice b{font-family:Fredoka;font-size:18px;font-weight:600;display:block}
.dice span{font-size:13.5px;color:#5c5a1a;font-weight:700}
.tip{display:flex;gap:12px;align-items:flex-start;margin-top:12px}
.tip .t-ico{width:36px;height:36px;border-radius:12px;background:#FDE7F1;display:grid;place-items:center;flex:none}
.tip p{margin:0;font-size:14px;color:var(--ink2);font-weight:600;line-height:1.45}
.tip b{color:var(--ink)}
/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;padding:0 12px calc(env(safe-area-inset-bottom) + 10px);pointer-events:none}
.tabs nav{pointer-events:auto;display:flex;gap:4px;background:rgba(34,23,43,.94);backdrop-filter:blur(12px);padding:7px;border-radius:24px;box-shadow:0 14px 30px -10px rgba(34,23,43,.5);max-width:456px;width:100%}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;border-radius:17px;color:#BFB2C9;font-size:11.5px;font-weight:800}
.tab.on{background:linear-gradient(135deg,var(--pink),var(--plum2));color:#fff}
/* plan */
.weekh{font-family:Fredoka;font-weight:600;font-size:16px;margin:18px 0 8px;display:flex;justify-content:space-between}
.weekh small{font-family:Nunito;color:var(--ink3);font-weight:800;font-size:12.5px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}
.day{aspect-ratio:1/1.18;border-radius:14px;background:#fff;border:1.5px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:800;font-size:15px;position:relative}
.day small{font-size:9.5px;color:var(--ink3);font-weight:800}
.day.done{background:linear-gradient(140deg,var(--pink),var(--plum));color:#fff;border-color:transparent}
.day.done small{color:#ffd9ea}
.day.cur{border-color:var(--pink);box-shadow:0 0 0 3px #FFD3E6}
.day.rest:not(.done){background:#EFFBF8;border-color:#CFF1EA}
/* list */
.ex{display:flex;gap:12px;align-items:center;padding:12px;background:#fff;border:1.5px solid var(--line);border-radius:18px;margin-bottom:9px;width:100%;text-align:left}
.badge{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;flex:none}
.ex b{display:block;font-size:15.5px;font-weight:800}
.ex span{font-size:12.5px;color:var(--ink3);font-weight:700}
.ex .chev{margin-left:auto;color:var(--ink3)}
/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.stat{background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:14px 10px;text-align:center}
.stat b{font-family:Fredoka;font-size:26px;font-weight:700;display:block;color:var(--plum)}
.stat span{font-size:12px;font-weight:800;color:var(--ink3)}
.wk{display:flex;justify-content:space-between;margin-top:6px}
.wk div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--ink3)}
.wk i{width:34px;height:34px;border-radius:12px;background:#F7EAF2;display:grid;place-items:center}
.wk i.on{background:linear-gradient(140deg,var(--pink),var(--plum))}
.wk i.today{outline:2px dashed var(--pink);outline-offset:2px}
.hist{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1.5px solid var(--line);font-weight:700;font-size:14.5px}
.hist:last-child{border-bottom:0}
.hist span{color:var(--ink3);font-size:12.5px}
.set{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1.5px solid var(--line);font-weight:700}
.set:last-child{border-bottom:0}
.set small{display:block;color:var(--ink3);font-weight:700;font-size:12.5px}
.tog{width:50px;height:30px;border-radius:99px;background:#E9DCE5;position:relative;transition:.2s;flex:none}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.2);transition:.2s}
.tog.on{background:var(--pink)}
.tog.on::after{left:23px}
.fine{font-size:12.5px;color:var(--ink3);line-height:1.5;font-weight:600}
/* overlay / player */
.ov{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;display:none}
.ov.show{display:block}
.player{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 14px) 20px calc(env(safe-area-inset-bottom) + 20px)}
.ptop{display:flex;justify-content:space-between;align-items:center}
.iconbtn{width:44px;height:44px;border-radius:14px;background:#fff;border:1.5px solid var(--line);display:grid;place-items:center}
.prog{flex:1;margin:0 12px;height:8px;background:#F3E1EC;border-radius:9px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--plum2));transition:width .3s}
.phase{text-align:center;margin-top:18px;font-weight:800;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--pink)}
.ringwrap{position:relative;width:min(70vw,270px);aspect-ratio:1;margin:12px auto 0}
.ringwrap svg.ring{width:100%;height:100%;transform:rotate(-90deg)}
.ringin{position:absolute;inset:14%;border-radius:50%;display:grid;place-items:center;text-align:center}
.ringin .big{font-family:Fredoka;font-size:58px;font-weight:700;line-height:1}
.ringin .sub{font-size:13px;font-weight:800;color:var(--ink3);margin-top:4px}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.pname{text-align:center;font-size:27px;font-weight:700;margin:16px 0 4px}
.pmeta{text-align:center;color:var(--ink2);font-weight:700;font-size:14px}
.cues{margin:16px 0 0;padding:14px 16px;background:#fff;border:1.5px solid var(--line);border-radius:18px;list-style:none}
.cues li{display:flex;gap:10px;font-size:14.5px;font-weight:600;color:var(--ink2);line-height:1.4;padding:4px 0}
.cues li em{font-style:normal;width:22px;height:22px;border-radius:8px;background:#FDE7F1;color:var(--pink);display:grid;place-items:center;font-weight:800;font-size:12px;flex:none}
.easy{margin-top:10px;font-size:13.5px;font-weight:700;color:var(--plum);background:#F6EAFB;padding:10px 14px;border-radius:14px}
.ctrls{display:flex;justify-content:center;align-items:center;gap:22px;margin-top:auto;padding-top:18px}
.cbtn{width:58px;height:58px;border-radius:20px;background:#fff;border:1.5px solid var(--line);display:grid;place-items:center}
.cbtn.main{width:78px;height:78px;border-radius:28px;background:linear-gradient(135deg,var(--pink),var(--plum));border:0;box-shadow:0 12px 26px -10px rgba(242,85,154,.9)}
.nextup{margin-top:12px;text-align:center;font-weight:700;color:var(--ink3);font-size:13.5px}
.nextup b{color:var(--ink)}
.restmode .phase{color:var(--teal)}
/* modal */
.modal{position:fixed;inset:0;z-index:80;background:rgba(34,23,43,.5);display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px)}
.modal.show{display:flex}
.sheet{background:#fff;width:100%;max-width:480px;border-radius:28px 28px 0 0;padding:22px 20px calc(env(safe-area-inset-bottom) + 20px);max-height:92vh;overflow:auto;animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet h2{font-size:24px;font-weight:700;margin-bottom:6px}
.sheet p{color:var(--ink2);font-weight:600;font-size:14.5px;line-height:1.5;margin:6px 0}
.grab{width:42px;height:5px;border-radius:9px;background:#E9DCE5;margin:-8px auto 14px}
.eqgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:14px 0}
.eq{padding:13px;border-radius:16px;border:1.5px solid var(--line);font-weight:800;font-size:14px;text-align:left;display:flex;gap:9px;align-items:center;background:#fff}
.eq.on{border-color:var(--pink);background:#FFF2F8;color:var(--pink)}
.eq i{width:20px;height:20px;border-radius:7px;border:2px solid #DCCBD7;flex:none;display:grid;place-items:center;font-style:normal;font-size:12px}
.eq.on i{background:var(--pink);border-color:var(--pink);color:#fff}
/* finish */
.done-wrap{text-align:center;padding-top:8vh}
.trophy{width:120px;height:120px;border-radius:40px;margin:0 auto;background:linear-gradient(140deg,var(--lime2),var(--lime));display:grid;place-items:center;box-shadow:0 18px 36px -14px rgba(220,218,46,.9);animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.4)}to{transform:scale(1)}}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:60}
.confetti i{position:absolute;top:-20px;width:10px;height:14px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.fadein{animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.pill{display:inline-block;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:800;background:#FDE7F1;color:var(--pink);margin:2px 4px 2px 0}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:14px;font-weight:700;font-size:14px;z-index:90;opacity:0;transition:.25s;pointer-events:none}
.toast.show{opacity:1}
/* ---- v2 additions: walk coach, weather, program, challenges ---- */
button:focus-visible,.inp:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
.iconbtn.sm{width:38px;height:38px;border-radius:12px}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px}
.mini>div,.mini>button{background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:12px;text-align:left;min-width:0}
.mini b{font-family:Fredoka;font-size:20px;font-weight:700;display:block;font-variant-numeric:tabular-nums}
.mini span{font-size:11.5px;font-weight:800;color:var(--ink3);display:block}
.meter{height:7px;background:#F3E1EC;border-radius:9px;overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--plum2));border-radius:9px}
.meter.teal{background:#DDF3EE}.meter.teal i{background:linear-gradient(90deg,#2EBFA5,#5A62C9)}
.meter.lime{background:#F1F0C9}.meter.lime i{background:linear-gradient(90deg,#C9C61E,#9DBA2A)}
.wx{background:linear-gradient(180deg,#F1F6FF 0%,#fff 60%);border-color:#DFE7F7}
.wxtop{display:flex;align-items:center;gap:12px}
.wxico{width:52px;height:52px;border-radius:17px;background:#E3EBFB;display:grid;place-items:center;flex:none}
.wxtemp{font-family:Fredoka;font-size:30px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.wxtemp small{font-family:Nunito;font-size:14px;font-weight:800;color:var(--ink2);margin-left:4px}
.wxsub{font-size:13px;font-weight:700;color:var(--ink2);margin-top:4px}
.verdict{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font-weight:800;font-size:13px;margin-top:14px}
.v-go{background:#E1F7F2;color:#137a68}.v-caution{background:#FFF0DE;color:#9a5300}.v-indoor{background:#FFE9E6;color:#b8352a}
.wear{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px}
.wear li{display:flex;gap:10px;align-items:center;font-weight:700;font-size:14px;color:var(--ink2);line-height:1.35}
.wear li i{width:30px;height:30px;border-radius:10px;background:#EEF2FC;display:grid;place-items:center;flex:none}
.nextwalk{display:flex;gap:12px;align-items:center;padding:12px;border-radius:16px;background:#EFFBF8;margin-top:14px}
.nextwalk .ico{width:42px;height:42px;border-radius:14px;background:#fff;display:grid;place-items:center;flex:none}
.nextwalk b{display:block;font-size:15px}
.nextwalk span{font-size:13px;font-weight:700;color:#2a6f62}
.nextwalk.now{background:linear-gradient(135deg,#D9F6EF,#E3EBFB)}
.manual{display:grid;gap:10px;margin-top:12px}
.manual label{font-size:12.5px;font-weight:800;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;display:grid;gap:6px}
.inp{width:100%;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);font:inherit;font-weight:700;font-size:16px;background:#fff;color:var(--ink)}
.chal{display:flex;gap:12px;align-items:center;padding:14px;border-radius:var(--r);background:#fff;border:1.5px solid var(--line);margin-bottom:9px}
.chal .badge{width:44px;height:44px}
.chal .body{flex:1;min-width:0}
.chal b{display:block;font-size:15px;font-weight:800}
.chal span{display:block;font-size:12.5px;font-weight:700;color:var(--ink3);line-height:1.4}
.chal.offer{background:linear-gradient(135deg,#FFFBD1,#F7F5B5);border-color:#ECE77A}
.chal.won{background:#F3FBF0;border-color:#CBEBC0}

html,body{overscroll-behavior-y:none}

.grab{cursor:grab}

.grabzone .grab{margin:0}
.xclose{position:absolute;right:12px;top:10px;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--raise);color:var(--ink2);z-index:4}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

const ds=d=>{d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const hm=d=>{d=d||new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function dayOf(s){return new Date(s+'T12:00')}
function dow(d){return (d.getDay()+6)%7}
function mondayOf(d){d=d||new Date();return addDays(d,-dow(d))}
function toMin(s){const [h,m]=String(s||'0:0').split(':').map(Number);return (h||0)*60+(m||0)}
function nowMin(){const d=new Date();return d.getHours()*60+d.getMinutes()}
function t12(min){const d=new Date();d.setHours(Math.floor(min/60)%24,min%60,0,0);return d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}
function h12(h){const d=new Date();d.setHours(h,0,0,0);return d.toLocaleTimeString([],{hour:'numeric'})}

const ENERGY={low:{w:30,r:20,max:2,min:1,label:'Low energy'},med:{w:40,r:15,max:3,min:1,label:'Steady'},high:{w:45,r:15,max:3,min:2,label:'Spicy'}};
function rng(seed){let s=(seed*2654435761)>>>0||7;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
function shuffle(a,r){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
/* Moves skipped for health conditions picked in the health check. A general, conservative guide, not medical advice. */
const COND={knee:'Knees',back:'Lower back',wrist:'Wrists or shoulders',balance:'Balance or dizziness',preg:'Pregnant or recently gave birth',heart:'Heart condition or high blood pressure',injury:'Recent surgery or injury'};
const AVOID={

 back:['flutter','bicycle','revcrunch','kneetuck','leanback','legraise','forwardfold','laundrysquat','tidysprint'],
 wrist:['incline','counterpush','stairpush','dips','stairdips','press','sideplank','counterplank','birddog','donkey','catcow'],

function hasCond(c){return (S.cond||[]).includes(c)}
function avoidReason(e){for(const c of (S.cond||[])){if(c==='balance'&&e.p.every(x=>x==='stairs'))return COND[c];if(AVOID[c]&&AVOID[c].includes(e.id))return COND[c]}return ''}
function capEnergy(en){return (en==='high'&&(hasCond('heart')||hasCond('injury')||hasCond('preg')))?'med':en}
function okAvail(e){return e.f!=='walk'&&(!e.req||S.equip[e.req])&&(S.stairs||!e.p.every(x=>x==='stairs'))&&!avoidReason(e)}
function placeSet(place){if(place==='any')return null;if(place==='home'||place==='house')return ['house','stand'].concat(S.stairs?['stairs']:[]);if(place==='stairs')return ['stairs','stand'];return [place]}
function okPlace(e,place){const set=placeSet(place);return !set||e.p.some(x=>set.includes(x))}
function pick(f,place,E,r,n,used){
 const base=e=>e.f===f&&okAvail(e);
 const tiers=[e=>base(e)&&okPlace(e,place)&&e.i<=E.max&&e.i>=E.min,e=>base(e)&&okPlace(e,place),e=>base(e)&&(placeSet(place)===null||!e.p.every(x=>x==='bed'))];
 const out=[];for(const t of tiers){for(const e of shuffle(EX.filter(t),r)){if(out.length>=n)break;if(!used.has(e.id)&&!out.includes(e)){out.push(e);used.add(e.id)}}if(out.length>=n)break}
 return out}
const RANK={bed:0,seat:1,stand:2,house:2,stairs:3,out:4};
function build({mins,energy,place,focus,seed,title}){
 const r=seed!=null?rng(seed):Math.random;const E=ENERGY[capEnergy(energy)]||ENERGY.low;const used=new Set();const steps=[];
 if(focus==='home')place='home';
 const T=mins*60;
 steps.push({type:'ready',secs:6});
 if(focus==='stretch'){
  let pool=pick('stretch',place,E,r,6,used).concat(pick('warm',place,E,r,3,used));if(!pool.length)pool=shuffle(EX.filter(okAvail),r).slice(0,4);
  const n=Math.max(3,Math.floor(T/55));
  for(let k=0;k<n;k++){const ex=pool[k%pool.length];steps.push({type:'work',ex,secs:45,phase:'Stretch'});if(k<n-1)steps.push({type:'rest',secs:10})}
 } else {
  const warm=pick('warm',place,E,r,2,used);
  warm.forEach(ex=>{steps.push({type:'work',ex,secs:30,phase:'Warm-up'});steps.push({type:'rest',secs:10})});
  const main=Math.max(90,T-160);const slot=E.w+E.r;const N=Math.max(3,Math.floor(main/slot));
  const K=Math.min(N,6);
  let order;
  if(focus==='core')order=['core','core','lower','core','upper','cardio','core'];
  else if(focus==='burn')order=['cardio','lower','upper','cardio','core','lower'];
  else if(focus==='home')order=['cardio','lower','upper','cardio','lower','core'];
  else order=['core','lower','upper','cardio','core','lower'];
  const chosen=[];const want={};order.slice(0,K).forEach(f=>want[f]=(want[f]||0)+1);
  const got={};for(const f in want)got[f]=pick(f,place,E,r,want[f],used);
  const ptr={};order.slice(0,K).forEach(f=>{ptr[f]=ptr[f]||0;const e=got[f][ptr[f]++];if(e)chosen.push(e)});
  const set=placeSet(place);const prim=e=>(set&&e.p.find(x=>set.includes(x)))||e.p[0];
  if(chosen.length<3){for(const e of shuffle(EX.filter(e=>okAvail(e)&&okPlace(e,place)&&!used.has(e.id)&&e.f!=='stretch'),r)){if(chosen.length>=3)break;chosen.push(e);used.add(e.id)}}
  if(!chosen.length)chosen.push(...shuffle(EX.filter(okAvail),r).slice(0,3));
  chosen.sort((a,b)=>RANK[prim(a)]-RANK[prim(b)]);
  for(let k=0;k<N;k++){const ex=chosen[k%chosen.length];steps.push({type:'work',ex,secs:E.w,phase:'Round '+(Math.floor(k/chosen.length)+1)});steps.push({type:'rest',secs:E.r})}
  const cool=pick('stretch',place,E,r,2,used);
  cool.forEach((ex,i)=>{steps.push({type:'work',ex,secs:30,phase:'Cool-down'});if(i<cool.length-1)steps.push({type:'rest',secs:10})});
 }

}
function finalize(steps,title,extra){
 for(let i=0;i<steps.length;i++)if(steps[i].type!=='work'){for(let j=i+1;j<steps.length;j++)if(steps[j].type==='work'){steps[i].next=steps[j].ex;break}}
 const total=steps.reduce((a,s)=>a+s.secs,0);
 return Object.assign({steps,total,title},extra||{});
}
/* Guided walk: easy warm-up, brisk/easy intervals, easy cool-down. Indoors adds stair climbs when the home has stairs. */
function buildWalk(mins,indoor,title){
 mins=Math.max(5,mins);const E=indoor?EXM.walkhouse:EXM.walkeasy,B=indoor?EXM.walkbriskin:EXM.walkbrisk;
 const steps=[{type:'ready',secs:5}];let rem=mins*60-240;
 steps.push({type:'work',ex:E,secs:120,phase:'Warm-up'});
 let i=0;while(rem>=60){
  if(i%2===0){const d=Math.min(180,rem);steps.push({type:'work',ex:B,secs:d,phase:'Brisk'});rem-=d}
  else if(indoor&&S.stairs&&!hasCond('balance')&&i%4===1){steps.push({type:'work',ex:EXM.stairclimb,secs:60,phase:'Stairs'});rem-=60}
  else{const d=Math.min(120,rem);steps.push({type:'work',ex:E,secs:d,phase:'Easy'});rem-=d}
  i++}
 steps.push({type:'work',ex:E,secs:120+Math.max(0,rem),phase:'Cool-down'});
 return finalize(steps,title||(indoor?'Indoor Walk':'Guided Walk'),{focus:'walk'});
}

/* What to wear: layers by feels-like temperature, then add-ons for wind, wet, ice, sun and darkness. */
function wear(w){

 else if(f<=-18){verdict='caution';head='Very cold. Keep it short';max=15}

 else if(f<0)head='Cold but walkable';

 if(f>=25)items.push(['shirt','Light, breathable top and shorts'],['hat','A cap or sun hat'],['drop','Bring water']);
 else if(f>=18)items.push(['shirt','T-shirt with shorts or light leggings']);
 else if(f>=10)items.push(['shirt','Long-sleeve top or a light layer'],['shirt','Leggings or joggers']);
 else if(f>=3)items.push(['shirt','Light jacket or fleece'],['shirt','Long pants'],['hand','Light gloves if your hands run cold']);
 else if(f>=-5)items.push(['shirt','Warm jacket over a long-sleeve top'],['hat','Toque'],['hand','Gloves'],['boot','Warm socks']);
 else if(f>=-15)items.push(['shirt','Thermal base layer'],['shirt','Winter parka'],['hat','Toque that covers your ears'],['hand','Insulated mitts or gloves'],['wind','Scarf or neck warmer']);
 else items.push(['shirt','Thermal base layer, top and bottom'],['shirt','Your warmest parka'],['hat','Warm toque'],['hand','Mitts (they\'re warmer than gloves)'],['wind','Face covering for the wind']);
 if(snow||ice||f<-5)items.push(['boot',ice?'Winter boots with good grip. Add ice cleats if sidewalks are icy':'Winter boots with good grip']);
 else items.push(['boot','Comfortable walking shoes']);

}

function openModal(html,opts){opts=opts||{};const sh=$('#sheet');sh.classList.toggle('locked',!!opts.locked);sh.style.transform='';
 sh.innerHTML='<div class="grabzone"><div class="grab"></div></div><button class="xclose" data-act="close" aria-label="Close">'+svg('x',18)+'</button>'+html;
 const m=$('#modal');if(!m.classList.contains('show'))sh.scrollTop=0;m.classList.add('show');document.body.style.overflow='hidden'}
function closeModal(){$('#modal').classList.remove('show');$('#sheet').style.transform='';if(!$('#ov').classList.contains('show'))document.body.style.overflow=''}
function dismissModal(){if($('#sheet').classList.contains('locked'))return;closeModal();if(P&&$('#modal').dataset.resume){P.running=true;P.last=performance.now();$('#modal').dataset.resume=''}}
/* swipe down on a sheet to close it (only when it is scrolled to the top) */
(function(){let y0=null,dy=0,drag=false;
 const sh=()=>$('#sheet');
 document.addEventListener('touchstart',ev=>{const s=sh();if(!s||!$('#modal').classList.contains('show')||!s.contains(ev.target))return;if(ev.target.closest('input,select,textarea'))return;
  if(s.scrollTop>0&&!ev.target.closest('.grabzone'))return;y0=ev.touches[0].clientY;dy=0;drag=false},{passive:true});
 document.addEventListener('touchmove',ev=>{if(y0==null)return;const s=sh();dy=ev.touches[0].clientY-y0;
  if(!drag&&dy>8&&(s.scrollTop<=0||ev.target.closest('.grabzone'))){drag=true;s.classList.add('dragging')}
  if(drag){ev.preventDefault();s.style.transform='translateY('+Math.max(0,dy)+'px)'}},{passive:false});
 document.addEventListener('touchend',()=>{if(y0==null)return;const s=sh();y0=null;if(!drag)return;drag=false;s.classList.remove('dragging');
  if(dy>110&&!s.classList.contains('locked')){s.classList.add('snap');s.style.transform='translateY(110%)';setTimeout(()=>{s.classList.remove('snap');dismissModal()},180)}
  else{s.classList.add('snap');s.style.transform='';setTimeout(()=>s.classList.remove('snap'),220)}});
 document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&$('#modal').classList.contains('show'))dismissModal()});
})();

/* ---------- SETUP: health check, goal, pace, home ---------- */
const GOALS={lose:'Lose weight',core:'Build a stronger core',move:'Move more every day',feel:'Feel better and sleep better'};
const PACES={gentle:{n:'Gentle',kg:0.2268,lb:'½ lb (0.2 kg) a week'},steady:{n:'Steady',kg:0.4536,lb:'1 lb (0.45 kg) a week'},faster:{n:'Faster',kg:0.6804,lb:'1½ lb (0.7 kg) a week'}};
let SU={step:0,first:false,cur:'',goal:''};
function paceRate(kg){const r=PACES[S.pace]?PACES[S.pace].kg:0.5;return Math.min(r,kg*0.01)}
function paceText(curKg,goalKg){if(!curKg||!goalKg)return '';if(goalKg>=curKg)return 'Your goal needs to be below your current weight.';
 const wks=Math.ceil((curKg-goalKg)/paceRate(curKg));const d=addDays(new Date(),wks*7);
 let t=`About ${wks} week${wks>1?'s':''} at this pace, around ${d.toLocaleDateString(undefined,{month:'long',day:'numeric',year:d.getFullYear()!==new Date().getFullYear()?'numeric':undefined})}.`;
 if(goalKg<curKg*0.8)t+=' That\'s a big change. Consider a first goal closer to where you are now, then set a new one when you get there.';return t}
function setupModal(step,first){SU.step=step;if(first!=null)SU.first=first;const N=4;const lc=lastCheck();
 if(SU.cur===''&&lc&&lc.kg!=null)SU.cur=String(r1(wDisp(lc.kg)));if(SU.goal===''&&S.goalKg)SU.goal=String(r1(wDisp(S.goalKg)));
 const dots=`<div class="steps-dots">${[...Array(N)].map((_,i)=>`<i class="${i<=step?'on':''}"></i>`).join('')}</div>`;
 let h='';
 if(step===0)h=`<div class="logo" style="width:56px;height:56px;border-radius:18px;margin-bottom:14px">${svg('db',30,'#fff',2.6)}</div><h2>${SU.first?'Welcome to SnugFit':'Goals & health'}</h2><p>${SU.first?'Workouts for real life: in bed, on the couch or around the house, plus walk prompts that fit your day and the weather. No jumping.':'Update your health check, your goal and your home setup.'}</p><p>Four quick questions so SnugFit fits you. About a minute.</p>`;
 else if(step===1)h=`${dots}<h2>Anything to work around?</h2><p>Pick any that apply. SnugFit will leave out moves that commonly bother these areas.</p><div class="eqgrid">${Object.entries(COND).map(([k,l])=>`<button class="eq ${['preg','heart','injury'].includes(k)?'wide':''} ${hasCond(k)?'on':''}" data-cond="${k}"><i>${hasCond(k)?'✓':''}</i>${l}</button>`).join('')}<button class="eq wide ${!(S.cond||[]).length?'on':''}" data-cond="none"><i>${!(S.cond||[]).length?'✓':''}</i>None of these</button></div>${(hasCond('preg')||hasCond('heart')||hasCond('injury'))?'<div class="note">Please check with your doctor or midwife before starting, and follow their advice over the app\'s. SnugFit will keep the intensity moderate.</div>':''}<p class="fine">This is a general guide, not medical advice. Stop any move that hurts.</p>`;
 else if(step===2){const preg=hasCond('preg');h=`${dots}<h2>What's your main goal?</h2><div class="eqgrid">${Object.entries(GOALS).map(([k,l])=>{const dis=preg&&k==='lose';return `<button class="eq wide ${S.goalType===k?'on':''}" data-sgoal="${k}" ${dis?'disabled style="opacity:.45"':''}><i>${S.goalType===k?'✓':''}</i>${l}</button>`}).join('')}</div>${preg?'<p class="fine">During pregnancy and soon after, the focus is on moving comfortably, so weight-loss goals are turned off.</p>':''}`;
  if(S.goalType==='lose'&&!preg)h+=`<div class="times" style="grid-template-columns:1fr 1fr"><label for="su-cur">Current weight (${S.units.w})<input id="su-cur" class="inp" type="number" inputmode="decimal" step="0.1" value="${esc(SU.cur)}"></label><label for="su-goal">Goal weight (${S.units.w})<input id="su-goal" class="inp" type="number" inputmode="decimal" step="0.1" value="${esc(SU.goal)}"></label></div>
  <div class="lbl">Pace</div><div class="chips">${Object.entries(PACES).map(([k,v])=>`<button class="chip ${S.pace===k?'on':''}" data-space="${k}">${v.n}</button>`).join('')}</div>
  <p class="fine" id="su-pace" style="margin-top:8px">${PACES[S.pace].n}: ${PACES[S.pace].lb}, capped at 1% of your weight per week. ${paceText(SU.cur?wIn(+SU.cur):0,SU.goal?wIn(+SU.goal):0)}</p>
  <div class="chips" style="margin-top:4px">${chips('uw',[['lb','lb'],['kg','kg']],S.units.w).replace(/^<div class="chips">|<\/div>$/g,'')}</div>`}
 else if(step===3)h=`${dots}<h2>Your home</h2><p>So house circuits use what you have.</p><div class="lbl">What kind of home?</div><div id="homepick">${homeHTML()}</div><div class="lbl">What do you have?</div>${equipHTML()}`;
 else h=`${dots}<h2>You're all set</h2><ul class="cues">${[S.goalType?'Goal: '+GOALS[S.goalType]+(S.goalType==='lose'&&S.goalKg?' · '+r1(wDisp(S.goalKg))+' '+S.units.w+' at a '+PACES[S.pace].n.toLowerCase()+' pace':''):'No goal picked yet',(S.cond||[]).length?'Working around: '+S.cond.map(c=>COND[c].toLowerCase()).join(', '):'No health limits picked',HOMES[S.home]+(S.stairs?' with stairs':'')].map((t,i)=>`<li><em>${i+1}</em>${esc(t)}</li>`).join('')}</ul><p class="fine">You can change any of this under Me → Goals & health.</p>`;
 const nav=`<div class="setupnav">${step>0?'<button class="btn soft" data-act="suback">Back</button>':''}<button class="btn pink" data-act="${step>=4?'sudone':'sunext'}">${step===0?'Let\'s go':step>=4?'Start':'Next'}</button></div>`;
 openModal(h+nav,{locked:SU.first})}
function suCollect(){const c=$('#su-cur'),g=$('#su-goal');if(c)SU.cur=c.value;if(g)SU.goal=g.value}
function suNext(){suCollect();
 if(SU.step===2&&S.goalType==='lose'&&!hasCond('preg')){const cur=parseFloat(SU.cur),goal=parseFloat(SU.goal);
  if(SU.cur!==''||SU.goal!==''){
   if(isNaN(cur)||wIn(cur)<25||wIn(cur)>350){toast('Enter your current weight in '+S.units.w);return}
   if(isNaN(goal)||wIn(goal)<25||wIn(goal)>=wIn(cur)){toast('Enter a goal weight below your current weight');return}
   const lc=lastCheck();if(!lc||lc.date!==ds()||lc.kg==null||Math.abs(wDisp(lc.kg)-cur)>0.05)saveCheck(ds(),wIn(cur),null);
   const gk=wIn(goal);if(!S.goalKg||Math.abs(S.goalKg-gk)>0.01||!S.paceStart)S.paceStart={date:ds(),kg:wIn(cur)};S.goalKg=gk;save()}}
 if(SU.step===2&&!S.goalType){toast('Pick a goal, or tap Next again to skip');S.goalType=S.goalType||'';SU.skip=(SU.skip||0)+1;if(SU.skip<2)return}
 setupModal(Math.min(4,SU.step+1))}
function suDone(){const firstTime=!S.setup2;S.onboarded=true;S.setup2=true;
 if(firstTime&&S.goalType==='lose'&&S.walkGoal===20)S.walkGoal=30;
 if(S.goalType==='core')S.focus='core';
 if(hasCond('preg')&&S.goalType==='lose')S.goalType='move';
 save();SU.first=false;$('#sheet').classList.remove('locked');closeModal();toast('You\'re set up. Have a good one!');render()}
function paceStatus(){if(!S.goalKg||!S.paceStart)return null;const ws=bodySorted().filter(e=>e.kg!=null);if(!ws.length)return null;const last=ws[ws.length-1];
 const weeks=Math.max(0,(dayOf(last.date)-dayOf(S.paceStart.date))/(7*864e5));const exp=Math.max(S.goalKg,S.paceStart.kg-paceRate(S.paceStart.kg)*weeks);
 const diff=wDisp(last.kg)-wDisp(exp);const wks=Math.ceil(Math.max(0,S.paceStart.kg-S.goalKg)/paceRate(S.paceStart.kg));
 return {exp:r1(wDisp(exp)),diff:r1(diff),eta:addDays(dayOf(S.paceStart.date),wks*7)}}

/* ---------- DAILY HABITS (water, protein, veggies) ---------- */
function habitsOn(d){const x=S.habits[d]||{};return {w:x.w||0,p:x.p||[0,0,0],v:x.v||0}}
function setHabit(fn){const d=ds();const x=habitsOn(d);fn(x);S.habits[d]=x;save();checkChallenges();render()}
function habitsCard(){const h=habitsOn(ds());const pm=h.p.filter(Boolean).length;
 return `<div class="sec"><h3>Daily habits</h3><small>no calorie counting</small></div><div class="card">
 <div class="habit"><div class="hl"><b>Water</b><span>${h.w>=S.waterGoal?'Goal reached. Nice!':'A glass is about 250 ml (1 cup)'}</span><div class="drops">${[...Array(S.waterGoal)].map((_,i)=>`<i class="${i<h.w?'on':''}"></i>`).join('')}</div></div><div class="stepper"><button data-hab="w-" aria-label="One less glass">${svg('minus',16)}</button><output>${h.w}/${S.waterGoal}</output><button data-hab="w+" aria-label="One more glass">${svg('plus',16)}</button></div></div>
 <div class="habit"><div class="hl"><b>Protein with meals</b><span>A palm-sized portion: eggs, chicken, fish, beans, tofu or Greek yogurt</span><div class="chips" style="margin-top:8px">${['Breakfast','Lunch','Dinner'].map((l,i)=>`<button class="chip ${h.p[i]?'on':''}" data-prot="${i}">${h.p[i]?'✓ ':''}${l}</button>`).join('')}</div></div></div>
 <div class="habit"><div class="hl"><b>Veggies & fruit</b><span>A serving is about a fist-sized portion</span></div><div class="stepper"><button data-hab="v-" aria-label="One less serving">${svg('minus',16)}</button><output>${h.v}/${S.vegGoal}</output><button data-hab="v+" aria-label="One more serving">${svg('plus',16)}</button></div></div>
 </div>`}
function habitsWeek(){const mon=mondayOf();let wd=0,pm=0,vd=0,days=0;for(let i=0;i<7;i++){const d=addDays(mon,i);if(ds(d)>ds())break;days++;const h=habitsOn(ds(d));if(h.w>=S.waterGoal)wd++;pm+=h.p.filter(Boolean).length;if(h.v>=S.vegGoal)vd++}return {wd,pm,vd,days}}

/* ---------- PLAYER ---------- */
let P=null;
function startWorkout(w,meta={}){
 P={w,meta,i:0,left:w.steps[0].secs,running:true,last:performance.now(),elapsed:0,spokenHalf:false,beeped:{}};
 try{if(navigator.wakeLock)navigator.wakeLock.request('screen').then(l=>P&&(P.lock=l)).catch(()=>{})}catch(e){}
 beep(660,.08,.05);
 $('#ov').classList.add('show');document.body.style.overflow='hidden';
 announce();drawPlayer();
 clearInterval(startWorkout._t);startWorkout._t=setInterval(tick,200);
}
function startWalk(m,indoor,meta){meta=meta||{};const w=buildWalk(m,indoor,meta.title);startWorkout(w,Object.assign({walk:true,indoor},meta))}
function durWords(s){return s>=60?Math.round(s/60)+(Math.round(s/60)===1?' minute':' minutes'):s+' seconds'}
function announce(){const s=P.w.steps[P.i];if(!s)return;
 if(s.type==='ready')say(`Let's go. ${P.w.title}. First up, ${s.next.n}.`);
 else if(s.type==='work')say(`${s.ex.n}. ${durWords(s.secs)}. ${s.ex.c[s.ex.f==='walk'?0:1]}`);
 else say(`Rest. Next up, ${s.next?s.next.n:'cool down'}.`);
}
function tick(){if(!P||!P.running)return;const now=performance.now();const dt=(now-P.last)/1000;P.last=now;P.left-=dt;P.elapsed+=dt;
 const s=P.w.steps[P.i];const L=Math.ceil(P.left);
 if(L<=3&&L>=1&&!P.beeped[L]){P.beeped[L]=1;beep(L===1?990:740)}
 if(s.type==='work'&&s.ex.s&&!P.spokenHalf&&P.left<=s.secs/2){P.spokenHalf=true;say('Switch sides');beep(520,.15)}
 if(P.left<=0){go(1,true);return}
 updatePlayer();
}
function go(d,auto){if(!P)return;const ni=P.i+d;if(ni<0)return;if(ni>=P.w.steps.length){finish();return}
 if(auto&&P.w.steps[P.i].type==='work')beep(1180,.25,.2);
 P.i=ni;P.left=P.w.steps[ni].secs;P.spokenHalf=false;P.beeped={};P.last=performance.now();announce();drawPlayer()}
function workIndex(){let n=0,c=0;P.w.steps.forEach((s,i)=>{if(s.type==='work'){n++;if(i<=P.i)c++}});return [c,n]}
function bigTime(){const l=Math.max(0,P.left);return l>=60?fmt(Math.ceil(l)):String(Math.ceil(l))}
function drawPlayer(){const s=P.w.steps[P.i];const ex=s.type==='work'?s.ex:s.next;const F=FOCUS[ex?ex.f:'core'];const isWork=s.type==='work';const [c,n]=workIndex();
 const color=isWork?F.color:'var(--c-teal)';const long=P.left>=60;
 const demo=ex?demoHTML(ex.id,isWork?F.color:'var(--c-teal)'):'';
 $('#ov').innerHTML=`<div class="player ${isWork?'':'restmode'} ${demo?'hasdemo':''}">
 <div class="ptop"><button class="iconbtn" data-act="quitask" aria-label="End workout">${svg('x',20)}</button><div class="prog"><i id="pbar"></i></div><button class="iconbtn" data-act="voice" aria-label="Voice coach">${svg('volume',20,S.voice?'var(--pink)':'var(--ink3)')}</button></div>
 <div class="phase">${isWork?s.phase+' · '+c+' of '+n:s.type==='ready'?'Get ready':'Rest'}</div>
 <div class="ringwrap"><svg class="ring" viewBox="0 0 120 120"><circle cx="60" cy="60" r="54" fill="none" style="stroke:${isWork?F.bg:'var(--fb-stretch)'}" stroke-width="10"/><circle id="ringc" cx="60" cy="60" r="54" fill="none" style="stroke:${color}" stroke-width="10" stroke-linecap="round" stroke-dasharray="339.3" stroke-dashoffset="0"/></svg>
 <div class="ringin" style="background:${isWork?F.bg:'var(--rest-in)'}"><div><div class="${P.running?'pulse':''}" style="display:grid;place-items:center;margin-bottom:6px">${svg(isWork?ex.f:'rest',38,color)}</div><div class="big ${long?'sm':''}" id="tleft">${bigTime()}</div><div class="sub">${long?'min left':'seconds'}</div></div></div></div>
 <div class="pname disp">${isWork?ex.n:s.type==='ready'?(P.meta.walk&&!P.meta.indoor?'Shoes on':'Get comfy'):'Breathe'}</div>
 <div class="pmeta">${isWork?(ex.s?'Switch sides halfway · ':'')+ex.p.map(x=>PLACE[x]).join(' / '):'Next up: <b>'+(ex?ex.n:'')+'</b>'}</div>
 ${demo}
 ${isWork?`<ul class="cues">${ex.c.map((x,i)=>`<li><em>${i+1}</em>${x}</li>`).join('')}</ul>${ex.easy?`<div class="easy">Easier: ${ex.easy}</div>`:''}`:(ex?`<ul class="cues">${ex.c.slice(0,1).map(x=>`<li><em>1</em>${x}</li>`).join('')}</ul>`:'')}
 <div class="ctrls"><button class="cbtn" data-act="prev" aria-label="Previous">${svg('prev',22)}</button><button class="cbtn main" data-act="pause" aria-label="Pause or play">${svg(P.running?'pause':'play',30,'#fff')}</button><button class="cbtn" data-act="next" aria-label="Next">${svg('next',22)}</button></div>
 <div class="nextup">${fmt(remaining())} left in ${P.meta.walk?'walk':'workout'}</div>
 </div>`;updatePlayer();startDemos($('#ov'))}
function remaining(){let t=Math.max(0,P.left);for(let j=P.i+1;j<P.w.steps.length;j++)t+=P.w.steps[j].secs;return t}
function updatePlayer(){const s=P.w.steps[P.i];const el=$('#tleft');if(el){el.textContent=bigTime();el.classList.toggle('sm',P.left>=60)}const rc=$('#ringc');if(rc)rc.setAttribute('stroke-dashoffset',String(339.3*(1-Math.max(0,P.left)/s.secs)));const pb=$('#pbar');if(pb)pb.style.width=(100*(1-remaining()/P.w.total))+'%';const nu=document.querySelector('.nextup');if(nu)nu.textContent=fmt(remaining())+' left in '+(P.meta.walk?'walk':'workout')}
function stopTimer(){clearInterval(startWorkout._t);try{speechSynthesis.cancel()}catch(e){}try{P&&P.lock&&P.lock.release()}catch(e){}}
function quit(){stopTimer();P=null;$('#ov').classList.remove('show');document.body.style.overflow='';render()}
function creditProg(){if(S.lastProg!==ds()){S.lastProg=ds();S.levelCount++}}
function finish(){stopTimer();const meta=P.meta;const m=mins(P.elapsed);
 if(!meta.trial){
  if(meta.walk)S.history.push({date:ds(),t:hm(),mins:m,title:P.w.title,walk:true,where:meta.indoor?'indoor':'outdoor',prog:!!meta.prog});
  else S.history.push({date:ds(),t:hm(),mins:m,title:P.w.title,kind:meta.house?'house':'workout',prog:!!meta.prog});
  if(meta.prog)creditProg();
  if(meta.planDay&&!S.planDone.includes(meta.planDay))S.planDone.push(meta.planDay);
  S.tipIdx++;save();checkChallenges()}
 say(meta.trial?'Nice work!':meta.walk?'Walk complete. Great job getting your steps in!':'Workout complete. You showed up, and that\'s everything. Amazing job!');
 const st=streak();const mon=mondayOf();const wkWalk=[...Array(7)].reduce((x,_,i)=>x+walkMinsOn(ds(addDays(mon,i))),0);
 $('#ov').innerHTML=`<div class="player"><div class="done-wrap"><div class="trophy">${svg(meta.walk?'walk':'trophy',60,'#22172B',2)}</div><h2 class="disp" style="font-size:32px;margin-top:22px">${meta.trial?'Nice!':'You did it!'}</h2><p style="color:var(--ink2);font-weight:700;margin:8px 0 22px">${esc(P.w.title)} · ${m} min</p>${meta.trial?'':`<div class="stats" style="margin-bottom:22px"><div class="stat"><b>${st}</b><span>day streak</span></div><div class="stat"><b>${S.history.filter(h=>!h.walk).length}</b><span>workouts</span></div><div class="stat"><b>${wkWalk}</b><span>walk min this week</span></div></div>`}<button class="btn pink block" data-act="closeov">Done</button>${meta.trial||meta.walk?'':'<button class="btn soft block" style="margin-top:10px" data-act="again">Feeling good? Go again</button>'}</div></div>`;
 if(!meta.trial)confetti();
}
function confetti(){const c=document.createElement('div');c.className='confetti';const cols=['#F2559A','#C25BD0','#DCDA2E','#FF8CC0','#2EBFA5','#FFA03A'];for(let i=0;i<70;i++){const p=document.createElement('i');p.style.left=Math.random()*100+'%';p.style.background=cols[i%cols.length];p.style.animationDuration=(1.8+Math.random()*1.8)+'s';p.style.animationDelay=(Math.random()*.6)+'s';c.appendChild(p)}document.body.appendChild(c);setTimeout(()=>c.remove(),4500)}

/* ---------- ACTIONS ---------- */
function startPlan(p){p=p||curPlanDay();if(!p)return;const w=build({mins:p.mins,energy:p.energy,place:'any',focus:p.focus,seed:p.day*97,title:'Core Comeback Day '+p.day+': '+p.title});startWorkout(w,{planDay:p.day})}
function startProg(dateStr){const d=dateStr?dayOf(dateStr):new Date();const s=progSession(d);
 if(s.focus==='walk'){startWalk(s.mins,verdictNow()==='indoor',{prog:true,title:s.title});return}
 const seed=Math.floor(dayOf(ds(d)).getTime()/864e5)*97;
 startWorkout(build({mins:s.mins,energy:s.energy,place:s.focus==='home'?'home':'any',focus:s.focus,seed,title:s.title}),{prog:true,house:s.focus==='home'})}
function randomWorkout(){const pk=a=>a[Math.floor(Math.random()*a.length)];const f=pk(['core','full','burn','core','stretch','home']);const names={core:['Couch Core Crush','Pillow-Top Abs','Belly Wake-Up'],full:['Lazy Sunday Flow','Blanket Burrito Burn','Snooze-Button Sculpt'],burn:['Netflix Sweat','Sofa Sizzle','Remote-Control Cardio'],stretch:['Melt-Into-Bed Stretch','Unwind & Unkink'],home:['Hallway Hustle','Kitchen Counter Club','Grand House Tour']};const w=build({mins:pk([5,7,10]),energy:pk(['low','med','med','high']),place:f==='home'?'home':pk(['any','bed','seat','any']),focus:f,title:pk(names[f])});startWorkout(w,{house:f==='home'})}
function savePref(k,v){if(k==='uw'||k==='ul'){if(k==='uw'&&$('#su-cur')){suCollect();const f=v==='kg'?1/KG_LB:KG_LB;if(S.units.w!==v){SU.cur=SU.cur?String(r1(+SU.cur*f)):'';SU.goal=SU.goal?String(r1(+SU.goal*f)):''}}S.units[k==='uw'?'w':'l']=v;save();if($('#su-cur'))setTimeout(()=>setupModal(2),0);return}const num=['mins','stepGoal','walkGoal'];S[k]=num.includes(k)?+v:v;if(k==='home'){S.stairs=(v==='two'||v==='split');if(S.place==='stairs'&&!S.stairs)S.place='any'}save()}
document.addEventListener('click',ev=>{
 const t=ev.target.closest('button');if(!t||t.disabled)return;
 if(t.dataset.tab){TAB=t.dataset.tab;try{history.replaceState(null,'','#'+TAB)}catch(e){try{location.hash=TAB}catch(_){}}render();window.scrollTo(0,0);if(TAB==='home')loadWeather();return}
 if(t.dataset.set){const k=t.dataset.set,v=t.dataset.v;if(k==='libf'){LIBF=v}else savePref(k,v);render();return}
 if(t.dataset.ex){exModal(t.dataset.ex);return}
 if(t.dataset.try){closeModal();const e=EXM[t.dataset.try];startWorkout(finalize([{type:'ready',secs:5},{type:'work',ex:e,secs:40,phase:'Practice'}],e.n),{trial:true});return}
 if(t.dataset.eq){S.equip[t.dataset.eq]=!S.equip[t.dataset.eq];save();t.classList.toggle('on');t.querySelector('i').textContent=S.equip[t.dataset.eq]?'✓':'';return}
 if(t.dataset.home){savePref('home',t.dataset.home);const hp=$('#homepick');if(hp)hp.innerHTML=homeHTML();return}
 if(t.dataset.tog){S[t.dataset.tog]=!S[t.dataset.tog];if(t.dataset.tog==='stairs'&&!S.stairs&&S.place==='stairs')S.place='any';save();t.classList.toggle('on');return}
 if(t.dataset.wxc){S.wxm.cond=t.dataset.wxc;save();render();return}
 if(t.dataset.walk){startWalk(+t.dataset.wm||LEVELS[S.level].walk,t.dataset.walk==='in',{prog:!!t.dataset.prog,title:t.dataset.prog?progSession().title:undefined});return}
 if(t.dataset.cond){const c=t.dataset.cond;if(c==='none')S.cond=[];else{const a=new Set(S.cond||[]);a.has(c)?a.delete(c):a.add(c);S.cond=[...a]}if(hasCond('preg')&&S.goalType==='lose')S.goalType='move';save();setupModal(1);return}
 if(t.dataset.sgoal){suCollect();S.goalType=t.dataset.sgoal;save();setupModal(2);return}
 if(t.dataset.space){suCollect();S.pace=t.dataset.space;save();setupModal(2);return}
 if(t.dataset.hab){const k=t.dataset.hab;setHabit(x=>{if(k==='w+')x.w=Math.min(20,x.w+1);if(k==='w-')x.w=Math.max(0,x.w-1);if(k==='v+')x.v=Math.min(15,x.v+1);if(k==='v-')x.v=Math.max(0,x.v-1)});return}
 if(t.dataset.prot){const i=+t.dataset.prot;setHabit(x=>{x.p=x.p.slice();x.p[i]=x.p[i]?0:1});return}
 if(t.dataset.delbody){const d=t.dataset.delbody;confirmModal('Delete this check-in?','The check-in from '+fmtD(d)+' will be removed.','Delete',()=>{S.body=S.body.filter(e=>e.date!==d);save();render()});return}
 if(t.dataset.join){joinCh(t.dataset.join);return}
 if(t.dataset.leave){const id=t.dataset.leave;confirmModal('Leave '+CH[id].name+'?','Your workouts and walks stay in your history.','Leave',()=>{S.ch=S.ch.filter(c=>c.id!==id);save();render()});return}
 if(t.dataset.lwm){LW.mins=+t.dataset.lwm;openModal(logWalkModal.mk());return}
 if(t.dataset.lww){LW.where=t.dataset.lww;openModal(logWalkModal.mk());return}
 if(t.dataset.city){const c=CITYRES[+t.dataset.city];if(c)setCity(c);return}
 if(t.dataset.wk){const s=progSession(dayOf(t.dataset.wk));const done=progDone(t.dataset.wk);const isT=t.dataset.wk===ds();
  openModal(`<div style="display:flex;gap:12px;align-items:center;margin-bottom:6px">${badge(s.focus,54)}<div><h2 style="margin:0">${s.title}</h2><span class="pill">${dayOf(t.dataset.wk).toLocaleDateString(undefined,{weekday:'long'})}${done?' · done':''}</span></div></div><p>${s.mins} minutes · ${ENERGY[s.energy].label}</p><p>${s.about}</p>${s.focus==='walk'?`<div class="row" style="margin-top:12px"><button class="btn pink" style="flex:1" data-walk="out" data-wm="${s.mins}" ${isT?'data-prog="1"':''}>${svg('walk',18)} Outside</button><button class="btn soft" style="flex:1" data-walk="in" data-wm="${s.mins}" ${isT?'data-prog="1"':''}>${svg('home',18)} Indoors</button></div>`:`<button class="btn pink block" style="margin-top:12px" data-progday="${t.dataset.wk}">${svg('play',18)} ${isT?'Start today\'s session':'Do this one now'}</button>`}`);return}
 if(t.dataset.progday){closeModal();const k=t.dataset.progday;if(k===ds())startProg();else{const s=progSession(dayOf(k));startWorkout(build({mins:s.mins,energy:s.energy,place:s.focus==='home'?'home':'any',focus:s.focus,seed:Math.floor(dayOf(k).getTime()/864e5)*97,title:s.title}),{house:s.focus==='home'})}return}
 if(t.dataset.day){const d=PLAN[+t.dataset.day-1];const done=S.planDone.includes(d.day);openModal(`<h2>Day ${d.day}: ${d.title}</h2><p>${d.mins} minutes · ${ENERGY[d.energy].label}${done?' · completed':''}</p><p>${d.rest?'A slow, gentle stretch to help you recover.':d.focus==='core'?'Mostly core moves, plus a little legs, arms and cardio.':d.focus==='burn'?'Gentle cardio mixed with strength to raise your heart rate, with no jumping.':'A balanced mix of core, legs, arms and gentle cardio.'}</p><button class="btn pink block" style="margin-top:12px" data-plan="${d.day}">${svg('play',18)} ${done?'Do it again':'Start Day '+d.day}</button>`);return}
 if(t.dataset.plan){closeModal();startPlan(PLAN[+t.dataset.plan-1]);return}
 const a=t.dataset.act;if(!a)return;
 ({
  startprog:()=>startProg(),
  bonus:()=>startWorkout(build({mins:5,energy:S.energy,place:'any',focus:'core',title:'Bonus Round'}),{}),
  quick:()=>{const T={core:'Quick Core',full:'Quick Full Body',burn:'Quick Burn',stretch:'Quick Stretch'};startWorkout(build({mins:S.mins,energy:S.energy,place:S.place,focus:S.focus,title:T[S.focus]}),{house:['house','stairs'].includes(S.place)})},
  random:randomWorkout,
  logwalk:logWalkModal,
  savewalk:()=>{const p=progSession();const cp=curPlanDay();const isProg=(p.k==='rest'||p.k==='walk')&&!progDone(ds());
   S.history.push({date:ds(),t:hm(),mins:LW.mins,title:LW.where==='in'?'Indoor walk':'Walk',walk:true,where:LW.where==='in'?'indoor':'outdoor',prog:isProg});
   if(isProg)creditProg();if(S.ch.some(c=>c.id==='core28')&&cp&&cp.rest&&!S.planDone.includes(cp.day))S.planDone.push(cp.day);
   save();checkChallenges();closeModal();toast(LW.mins+'-min walk logged. Nice!');render()},
  checkin:checkinModal,
  savecheck:()=>{const w=parseFloat(($('#ciw')||{}).value),l=parseFloat(($('#cil')||{}).value),d=($('#cid')||{}).value||ds();
   const kg=isNaN(w)?null:wIn(w),cm=isNaN(l)?null:lIn(l);
   if(kg==null&&cm==null){toast('Enter your weight, your waist, or both');return}
   if(kg!=null&&(kg<25||kg>350)){toast('That weight looks off. Check the unit ('+S.units.w+')');return}
   if(cm!=null&&(cm<40||cm>250)){toast('That waist looks off. Check the unit ('+S.units.l+')');return}
   if(!/^\d{4}-\d{2}-\d{2}$/.test(d)||d>ds()){toast('Pick a date up to today');return}
   saveCheck(d,kg,cm);closeModal();toast('Check-in saved');render()},
  goal:goalModal,
  savegoal:()=>{const v=parseFloat(($('#goalin')||{}).value);if(isNaN(v)||wIn(v)<25||wIn(v)>350){toast('Enter a goal weight in '+S.units.w);return}S.goalKg=wIn(v);const lc2=lastCheck();S.paceStart={date:ds(),kg:lc2&&lc2.kg!=null?lc2.kg:S.goalKg};save();closeModal();toast('Goal saved');render()},
  cleargoal:()=>{S.goalKg=null;save();closeModal();render()},
  steps:stepsModal,
  savesteps:()=>{const v=parseInt(($('#stepsin')||{}).value,10);if(isNaN(v)||v<0){toast('Enter a number of steps');return}const x=S.health[ds()]||{};x.steps=v;x.src='';x.at=hm();S.health[ds()]=x;save();checkChallenges();closeModal();toast('Steps saved');render()},
  health:healthModal,
  copyurl:()=>{const u=appURL()+'?steps=';try{navigator.clipboard.writeText(u).then(()=>toast('Address copied'),()=>{selectText('#hurl');toast('Select and copy the address')})}catch(e){selectText('#hurl');toast('Select and copy the address')}},
  city:cityModal,
  calgary:()=>setCity({name:'Calgary',lat:51.0447,lon:-114.0719}),
  citysearch:citySearch,
  geo:()=>{try{navigator.geolocation.getCurrentPosition(p=>setCity({name:'My location',lat:+p.coords.latitude.toFixed(3),lon:+p.coords.longitude.toFixed(3)}),()=>toast('Location isn\'t available here. Search for your city instead.'),{timeout:8000})}catch(e){toast('Location isn\'t available here. Search for your city instead.')}},
  wxretry:()=>loadWeather(true),
  levelup:()=>{if(S.level<6){S.level++;S.levelCount=0;save();toast('Level '+S.level+': '+LEVELS[S.level].n);render()}},
  levelwait:()=>{S.levelCount=Math.max(0,LEVEL_UP-5);save();render()},
  leveldown:()=>{if(S.level>1){S.level--;S.levelCount=0;save();toast('Level '+S.level+': '+LEVELS[S.level].n);render()}},
  pause:()=>{P.running=!P.running;P.last=performance.now();if(!P.running){try{speechSynthesis.cancel()}catch(e){}}drawPlayer()},
  next:()=>go(1),prev:()=>go(-1),
  voice:()=>{S.voice=!S.voice;save();if(!S.voice)try{speechSynthesis.cancel()}catch(e){};drawPlayer()},
  quitask:()=>{const was=P.running;P.running=false;confirmModal('End '+(P.meta.walk?'walk':'workout')+'?','This session won\'t be saved.','End it',quit);$('#modal').dataset.resume=was?'1':''},
  close:dismissModal,
  closeov:()=>{P=null;$('#ov').classList.remove('show');document.body.style.overflow='';render()},
  again:()=>startWorkout(build({mins:5,energy:'low',place:'any',focus:'core',title:'Bonus Round'}),{}),
  equip:()=>openModal(`<h2>My equipment</h2><p>Moves that need something you don't have will be skipped.</p>${equipHTML()}<button class="btn pink block" data-act="eqdone">Save</button>`),
  eqdone:()=>{closeModal();render()},
  onboarded:()=>{S.onboarded=true;save();closeModal();render()},
  install:()=>{if(!INSTALL_EVT)return;INSTALL_EVT.prompt();INSTALL_EVT.userChoice.finally(()=>{INSTALL_EVT=null;render()})},
  setup:()=>setupModal(S.setup2?1:0,false),sunext:suNext,suback:()=>{suCollect();setupModal(Math.max(0,SU.step-1))},sudone:suDone,
  resetplan:()=>confirmModal('Restart Core Comeback?','Your streak and history stay. Only the 28-day challenge goes back to Day 1.','Restart',()=>{S.planDone=[];save();render()}),
  wipe:()=>confirmModal('Reset everything?','This clears your streak, history, level, challenges and check-ins on this device. Your home, equipment, units and location settings stay.','Reset',()=>{const keep={cond:S.cond,goalType:S.goalType,pace:S.pace,setup2:S.setup2,units:S.units,equip:S.equip,home:S.home,stairs:S.stairs,city:S.city,meals:S.meals,stepGoal:S.stepGoal,walkGoal:S.walkGoal};S=Object.assign(JSON.parse(JSON.stringify(DEF)),keep,{onboarded:true});save();render()})
 })[a]?.();
});
function selectText(sel){try{const el=$(sel);const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r)}catch(e){}}
async function citySearch(){const q=(($('#cityq')||{}).value||'').trim();const box=$('#cityres');if(!q||!box)return;box.innerHTML='<p class="fine">Searching…</p>';
 try{const res=await fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(q)+'&count=5&language=en&format=json');const d=await res.json();
  CITYRES=(d.results||[]).map(r=>({name:r.name+(r.admin1?', '+r.admin1:''),lat:+r.latitude.toFixed(3),lon:+r.longitude.toFixed(3),sub:r.country||''}));
  box.innerHTML=CITYRES.length?CITYRES.map((c,i)=>`<button class="btn soft block" style="justify-content:flex-start" data-city="${i}">${svg('pin',16)} ${esc(c.name)} <span class="fine">${esc(c.sub)}</span></button>`).join(''):'<p class="fine">No places found. Try another spelling.</p>'}
 catch(e){box.innerHTML='<p class="fine">City search can\'t reach the internet from this preview. It works in the hosted version.</p>'}}
document.addEventListener('change',ev=>{const t=ev.target;if(!t||!t.id)return;
 if(t.id.startsWith('meal-')){const k=t.id.slice(5);if(/^\d{2}:\d{2}$/.test(t.value)){S.meals[k]=t.value;save()}return}
 if(t.id==='wxtemp'){const v=parseFloat(t.value);if(!isNaN(v)){S.wxm.temp=Math.max(-50,Math.min(50,v));save();render()}return}});
document.addEventListener('input',ev=>{const t=ev.target;if(t&&(t.id==='su-cur'||t.id==='su-goal')){suCollect();const el=$('#su-pace');if(el)el.textContent=PACES[S.pace].n+': '+PACES[S.pace].lb+', capped at 1% of your weight per week. '+paceText(SU.cur?wIn(+SU.cur):0,SU.goal?wIn(+SU.goal):0)}});
document.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&ev.target&&ev.target.id==='cityq'){ev.preventDefault();citySearch()}});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')dismissModal()});
window.addEventListener('hashchange',()=>{const h=location.hash.replace('#','');if(['home','plan','moves','me'].includes(h)&&h!==TAB){TAB=h;render()}});
/* ---------- INSTALL & OFFLINE ---------- */
const STANDALONE=(()=>{try{return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true}catch(e){return false}})();
const IOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
let INSTALL_EVT=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();INSTALL_EVT=e;if(TAB==='me')render()});
if(HOSTED&&'serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
window.addEventListener('offline',()=>toast('You\'re offline. Workouts still work; weather will update when you\'re back.'));
window.addEventListener('online',()=>{toast('Back online');loadWeather(true)});
function installCard(){if(STANDALONE)return '';
 if(!HOSTED)return `<div class="card"><div class="set"><div>Install SnugFit<small>Open SnugFit from your own web address (mimiobuhtig.github.io/Snugfit) to add it to your home screen and use it offline.</small></div></div></div>`;
 if(INSTALL_EVT)return `<div class="card"><div class="set"><div>Install SnugFit<small>Adds it to your home screen. Works offline.</small></div><button class="btn pink sm" data-act="install">Install</button></div></div>`;
 return `<div class="card"><div class="setcol"><small>${IOS?'In Safari: tap the Share button (the square with an arrow), then <b>Add to Home Screen</b>, then <b>Add</b>. SnugFit then opens full screen like an app and works without internet.':'In your browser menu, choose <b>Install app</b> or <b>Add to Home screen</b>. SnugFit then opens like an app and works without internet.'}</small></div></div>`}
pruneChallenges();save();
render();
loadWeather();
if(!S.onboarded)onboarding();
</script>
